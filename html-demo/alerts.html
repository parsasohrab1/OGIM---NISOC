<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - OGIM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-oil-well"></i>
            <h2>OGIM</h2>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="wells.html" class="nav-item">
                <i class="fas fa-oil-well"></i>
                <span>Wells</span>
            </a>
            <a href="alerts.html" class="nav-item active">
                <i class="fas fa-bell"></i>
                <span>Alerts</span>
                <span class="badge" id="alertBadge">0</span>
            </a>
            <a href="analytics.html" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </a>
            <a href="#" class="nav-item" onclick="showSettings()">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="username">System Administrator</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1><i class="fas fa-bell"></i> Alert Management</h1>
                <p>View and manage system alerts</p>
            </div>
            <div class="header-right">
                <div class="connection-status" id="connectionStatus">
                    <i class="fas fa-circle"></i>
                    <span>Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters-card">
            <div class="filters-row">
                <div class="filter-group">
                    <label>Level:</label>
                    <select id="severityFilter" onchange="filterAlerts()">
                        <option value="all">All</option>
                        <option value="critical">Critical</option>
                        <option value="warning">Warning</option>
                        <option value="info">Info</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Status:</label>
                    <select id="statusFilter" onchange="filterAlerts()">
                        <option value="all">All</option>
                        <option value="open">Open</option>
                        <option value="acknowledged">Acknowledged</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Well:</label>
                    <select id="wellFilter" onchange="filterAlerts()">
                        <option value="all">All</option>
                        <option value="PROD-001">PROD-001</option>
                        <option value="PROD-002">PROD-002</option>
                        <option value="DEV-001">DEV-001</option>
                        <option value="OBS-001">OBS-001</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="loadAllAlerts()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="fas fa-exclamation-circle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="criticalCount">-</h3>
                    <p>Critical</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="warningCount">-</h3>
                    <p>Warning</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="infoCount">-</h3>
                    <p>Info</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="resolvedCount">-</h3>
                    <p>Resolved</p>
                </div>
            </div>
        </div>

        <!-- Alerts List -->
        <div class="alerts-container" id="alertsContainer">
            <div class="loading">Loading alerts...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="api.js"></script>
    <script>
        let allAlerts = [];
        let isConnected = false;
        let useMockData = false;

        document.addEventListener('DOMContentLoaded', async () => {
            await checkConnection();
            await loadAllAlerts();
            
            // Auto refresh every 30 seconds
            setInterval(loadAllAlerts, 30000);
        });

        async function checkConnection() {
            const statusEl = document.getElementById('connectionStatus');
            
            try {
                isConnected = await api.healthCheck();
                
                if (isConnected) {
                    statusEl.className = 'connection-status connected';
                    statusEl.innerHTML = '<i class="fas fa-circle"></i><span>Connected to server</span>';
                    useMockData = false;
                } else {
                    throw new Error('Backend not available');
                }
            } catch (error) {
                isConnected = false;
                useMockData = true;
                statusEl.className = 'connection-status disconnected';
                statusEl.innerHTML = '<i class="fas fa-circle"></i><span>Offline mode (sample data)</span>';
            }
        }

        async function loadAllAlerts() {
            try {
                if (useMockData) {
                    allAlerts = mockData.generateAlerts(20);
                } else {
                    const response = await api.getAlerts();
                    allAlerts = response.alerts || [];
                }
                
                updateStats();
                filterAlerts();
            } catch (error) {
                console.error('Error loading alerts:', error);
                allAlerts = mockData.generateAlerts(20);
                updateStats();
                filterAlerts();
            }
        }

        function updateStats() {
            const critical = allAlerts.filter(a => a.severity === 'critical').length;
            const warning = allAlerts.filter(a => a.severity === 'warning').length;
            const info = allAlerts.filter(a => a.severity === 'info').length;
            const resolved = allAlerts.filter(a => a.status === 'resolved').length;
            
            document.getElementById('criticalCount').textContent = critical;
            document.getElementById('warningCount').textContent = warning;
            document.getElementById('infoCount').textContent = info;
            document.getElementById('resolvedCount').textContent = resolved;
            document.getElementById('alertBadge').textContent = critical + warning + info;
        }

        function filterAlerts() {
            const severityFilter = document.getElementById('severityFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const wellFilter = document.getElementById('wellFilter').value;
            
            let filtered = allAlerts;
            
            if (severityFilter !== 'all') {
                filtered = filtered.filter(a => a.severity === severityFilter);
            }
            
            if (statusFilter !== 'all') {
                filtered = filtered.filter(a => a.status === statusFilter);
            }
            
            if (wellFilter !== 'all') {
                filtered = filtered.filter(a => a.well_name === wellFilter);
            }
            
            displayAlerts(filtered);
        }

        function displayAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            
            if (alerts.length === 0) {
                container.innerHTML = '<div class="alert-item"><div class="loading">No alerts found</div></div>';
                return;
            }
            
            container.innerHTML = '';
            
            alerts.forEach(alert => {
                const alertEl = document.createElement('div');
                alertEl.className = `alert-item ${alert.severity}`;
                alertEl.innerHTML = `
                    <div class="alert-header-row">
                        <span class="alert-severity">
                            ${getSeverityIcon(alert.severity)} ${translateSeverity(alert.severity)}
                        </span>
                        <span class="alert-time">${formatTime(alert.timestamp)}</span>
                    </div>
                    <div class="alert-details">
                        <p><strong>Well:</strong> ${alert.well_name}</p>
                        <p><strong>Message:</strong> ${alert.message}</p>
                        <p><strong>Status:</strong> ${translateStatus(alert.status)}</p>
                    </div>
                    <div class="alert-actions">
                        ${alert.status === 'open' ? `
                            <button class="btn btn-small btn-primary" onclick="acknowledgeAlert('${alert.alert_id}')">
                                <i class="fas fa-check"></i> Acknowledge
                            </button>
                            <button class="btn btn-small btn-secondary" onclick="resolveAlert('${alert.alert_id}')">
                                <i class="fas fa-times"></i> Resolved
                            </button>
                        ` : ''}
                        ${alert.status === 'acknowledged' ? `
                            <button class="btn btn-small btn-secondary" onclick="resolveAlert('${alert.alert_id}')">
                                <i class="fas fa-times"></i> Resolved
                            </button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(alertEl);
            });
        }

        async function acknowledgeAlert(alertId) {
            try {
                if (!useMockData) {
                    await api.acknowledgeAlert(alertId, 'admin');
                }
                
                const alert = allAlerts.find(a => a.alert_id === alertId);
                if (alert) {
                    alert.status = 'acknowledged';
                }
                
                filterAlerts();
                alert('Alert acknowledged');
            } catch (error) {
                console.error('Error acknowledging alert:', error);
                alert('Error acknowledging the alert');
            }
        }

        async function resolveAlert(alertId) {
            try {
                if (!useMockData) {
                    await api.resolveAlert(alertId);
                }
                
                const alert = allAlerts.find(a => a.alert_id === alertId);
                if (alert) {
                    alert.status = 'resolved';
                }
                
                updateStats();
                filterAlerts();
                alert('Alert resolved');
            } catch (error) {
                console.error('Error resolving alert:', error);
                alert('Error resolving the alert');
            }
        }

        function getSeverityIcon(severity) {
            const icons = {
                'critical': '<i class="fas fa-exclamation-circle"></i>',
                'warning': '<i class="fas fa-exclamation-triangle"></i>',
                'info': '<i class="fas fa-info-circle"></i>'
            };
            return icons[severity] || '';
        }

        function translateSeverity(severity) {
            const translations = {
                'critical': 'Critical',
                'warning': 'Warning',
                'info': 'Info'
            };
            return translations[severity] || severity;
        }

        function translateStatus(status) {
            const translations = {
                'open': 'Open',
                'acknowledged': 'Acknowledged',
                'resolved': 'Resolved'
            };
            return translations[status] || status;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('fa-IR', { 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }
    </script>
    
    <style>
        .filters-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        
        .filters-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .filter-group label {
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .filter-group select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            min-width: 150px;
        }
        
        .alerts-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .alert-details {
            margin: 1rem 0;
            font-size: 0.875rem;
        }
        
        .alert-details p {
            margin: 0.5rem 0;
        }
        
        .alert-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
    </style>
</body>
</html>
